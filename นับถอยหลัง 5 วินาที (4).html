<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>นับถอยหลัง 5 วินาที</title>
<style>
:root{--bg:#f3efe6;--ink:#1d2a3a;--ring:#d9d2c0;--acc:#2f6f6a;--done:#c2452d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202b;--ink:#eef2f5;--ring:#2a3b4b;--acc:#6fc7bd;--done:#ff8a6b}}
:root[data-theme="dark"]{--bg:#14202b;--ink:#eef2f5;--ring:#2a3b4b;--acc:#6fc7bd;--done:#ff8a6b}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;cursor:pointer}
.wrap{position:relative;width:min(72vw,56vh,380px);aspect-ratio:1}
svg{width:100%;height:100%;transform:rotate(-90deg);transition:opacity .4s}
circle{fill:none;stroke-width:8}
.bg{stroke:var(--ring)}
.fg{stroke:var(--acc);stroke-linecap:round}
#n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-size:min(34vw,28vh,190px);font-weight:700;font-variant-numeric:tabular-nums}
.done #n{color:var(--done)}
.done .fg{stroke:var(--done)}
.done svg{opacity:.3}
.done.holding svg{opacity:1}
#fs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:46px;height:46px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;opacity:.75}
#fs svg{width:24px;height:24px;transform:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#fs .ex{display:none}
#fs.on .en{display:none}
#fs.on .ex{display:block}
p{margin:0;font-size:1.05rem;opacity:.7;text-align:center;padding:0 1rem}
</style>
</head>
<body>
<div class="wrap"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="fg" cx="50" cy="50" r="45"/></svg><div id="n">0</div></div>
<p id="hint">กดค้างไว้</p>
<button id="fs" type="button" aria-label="เต็มหน้าจอ"><svg class="en" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="ex" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
<script>
var TOTAL=5000,HOLD=500,C=2*Math.PI*45,start=performance.now(),raf,finished=false;
var holdStart=0,holding=false,full=false,holdRaf;
var n=document.getElementById('n'),fg=document.getElementById('fg'),hint=document.getElementById('hint');
var b=document.body;
fg.style.strokeDasharray=C;

var curP=0,REFILL=250;
function setRing(p){curP=p;fg.style.strokeDashoffset=C*(1-p)}
function tick(now){
  var left=Math.min(TOTAL,Math.max(0,TOTAL-(now-start)));
  n.textContent=Math.ceil(left/1000);
  setRing(left/TOTAL);
  if(left<=0){finished=true;b.classList.add('done');hint.textContent='กดค้างไว้';return}
  raf=requestAnimationFrame(tick);
}
function restart(){
  cancelAnimationFrame(raf);cancelAnimationFrame(holdRaf);
  finished=false;holding=false;full=false;
  b.classList.remove('done','holding');
  hint.textContent='แตะที่หน้าจอ';
  n.textContent=5;
  setRing(1);
  start=performance.now();
  raf=requestAnimationFrame(tick);
}
function holdTick(now){
  if(!holding)return;
  var p=Math.min(1,(now-holdStart)/HOLD);
  setRing(p);
  if(p>=1&&!full){full=true;try{if(navigator.vibrate)navigator.vibrate(200)}catch(e){}}
  holdRaf=requestAnimationFrame(holdTick);
}
document.addEventListener('pointerdown',function(){
  if(!finished){try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}restart();return}
  holding=true;full=false;holdStart=performance.now();
  b.classList.add('holding');
  holdRaf=requestAnimationFrame(holdTick);
});
function release(){
  if(!finished||!holding)return;
  holding=false;cancelAnimationFrame(holdRaf);
  if(full){restart()}
  else{b.classList.remove('holding');setRing(0)}
}
document.addEventListener('pointerup',release);
document.addEventListener('pointercancel',release);
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
var fsb=document.getElementById('fs'),de=document.documentElement;
if(!(de.requestFullscreen||de.webkitRequestFullscreen))fsb.style.display='none';
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
fsb.addEventListener('pointerdown',function(e){e.stopPropagation()});
fsb.addEventListener('pointerup',function(e){e.stopPropagation()});
fsb.addEventListener('click',function(e){e.stopPropagation();
  try{if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}}catch(err){}});
function fsUpdate(){fsb.classList.toggle('on',isFs())}
document.addEventListener('fullscreenchange',fsUpdate);
document.addEventListener('webkitfullscreenchange',fsUpdate);
finished=true;b.classList.add('done');setRing(0);
</script>
</body>
</html>
